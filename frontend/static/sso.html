<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登入中…</title>
  <meta name="robots" content="noindex">
  <style>
    body { font-family: "Noto Sans TC", sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #fafafa; color: #333; }
    .box { text-align: center; }
    .spin { width: 36px; height: 36px; margin: 0 auto 1rem; border: 3px solid #eee; border-top-color: #6366f1; border-radius: 50%; animation: r 0.8s linear infinite; }
    @keyframes r { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="box"><div class="spin"></div><p id="msg">帳號同步中，馬上好…</p></div>
<script>
(async () => {
  const APP_ID = "app_3lXIxPKb";
  const LMU = "https://letmeuse.isnowfriend.com";
  const params = new URLSearchParams(location.hash.slice(1));
  const code = params.get("code");
  const nextRaw = params.get("next") || "/";
  // 只允許站內相對路徑，防 open redirect
  // 用 URL 解析後比對 origin:只看開頭是不是 "/" 擋不住 "/\evil.com" 或夾了 Tab 的寫法
  let next = "/";
  try {
    const target = new URL(nextRaw, location.origin);
    if (target.origin === location.origin) next = target.pathname + target.search + target.hash;
  } catch (err) { /* 解析不了就回首頁 */ }

  if (!code) { location.replace("/"); return; }
  // 已經登入的人不換帳號:不然別人做一條連結,就能把這台瀏覽器的登入換成他的
  if (localStorage.getItem("lmu_" + APP_ID + "_access_token")) { location.replace(next); return; }
  try {
    const res = await fetch(LMU + "/api/auth/sso/redeem", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code, appId: APP_ID }),
    });
    const json = await res.json();
    const data = json.data || json;
    if (res.ok && data.accessToken) {
      localStorage.setItem("lmu_" + APP_ID + "_access_token", data.accessToken);
      localStorage.setItem("lmu_" + APP_ID + "_refresh_token", data.refreshToken);
    } else {
      document.getElementById("msg").textContent = "同步失敗，請直接登入";
    }
  } catch (err) {
    document.getElementById("msg").textContent = "連線失敗，請直接登入";
  }
  location.replace(next);
})();
</script>
</body>
</html>
